name: Bug report
description: Something is broken or behaves differently from the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, preset or recipe JSON, and a minimal project if possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI installer
        - Component or style
        - Compiler or contracts
        - Preset or recipe editor
        - Docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@ombelle-ui/cli version or commit"
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node, package manager and version, and browser if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or screenshots
      render: shell
