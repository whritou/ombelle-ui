name: CI
# Checks for every push and pull request: build, unit and integration tests, and a
# browser subset (interaction specs and a scoped specimen audit). The full Foundation
# gate (every consumer app, the browser matrix, the complete specimen audit and the
# evidence) runs nightly and on demand in foundation.yml.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Fail on stale generated sources
        # build:packages regenerates the schema and catalog copies; committed copies must already match.
        run: git diff --exit-code -- packages/contracts/src packages/catalog/src/generated.ts packages/catalog/src/generated-presets.ts
      - name: Audit dependencies
        run: pnpm audit:workspace
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm exec vitest run packages apps/www/src
  integration:
    runs-on: ubuntu-latest
    # Shard 4 holds the hosted preview build and the foundation evidence
    # collection, about 15 minutes together; with the 0.9 components the shard
    # runs 17 to 20 minutes, so it has room up to 30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Integration tests drive real npm, pnpm, Yarn and Bun installs, so they
      # need the pinned toolchain and download caches.
      - name: Set up pinned tools and download caches
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: integration
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Integration tests (shard ${{ matrix.shard }} of 4)
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration --shard=${{ matrix.shard }}/4
  # Browser tests on every change (TST-01): the interaction specs on the preview pages,
  # and the specimen audit of the components the change touches plus a fixed sample, in
  # every family, edition and mode. The complete audit and the consumer matrix run in
  # foundation.yml, which a release needs green.
  browser:
    runs-on: ubuntu-latest
    # The audit part measures up to 12 components in every configuration (scripts/pr-audit-components.ts).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [interactions, audit]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Cache Playwright browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Interaction specs on the preview pages
        if: matrix.part == 'interactions'
        run: node scripts/pr-browser.mjs interactions
      - name: Specimen audit of the changed components and a sample
        if: matrix.part == 'audit'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then git fetch --no-tags --depth=1 origin "$BASE_SHA" || true; fi
          node scripts/pr-browser.mjs audit "$BASE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        timeout-minutes: 5
        with:
          name: browser-${{ matrix.part }}-report
          path: |
            test-results
            .artifacts/specimen-audit/partial
          if-no-files-found: ignore
  # The site's JavaScript budget (scripts/www-budget.json, docs/evidence/www-performance-1-0.md):
  # a production build of apps/www and its preview frame, then the size of what each route loads.
  www-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Build the site
        run: pnpm build:www
      - name: Check the site budget
        run: pnpm check:www-budget
  # Keep this job ID/check name required in branch protection.
  verify:
    needs: [checks, integration, browser, www-budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BUDGET_RESULT: ${{ needs.www-budget.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success && test "$BROWSER_RESULT" = success && test "$BUDGET_RESULT" = success
