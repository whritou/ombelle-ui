name: CI
# Fast checks for every push and pull request, aiming for under five minutes.
# The full Foundation gate (40 consumer apps, the browser matrix and
# evidence) runs nightly and on demand in foundation.yml.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm exec vitest run packages apps/www/src
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Integration tests drive real npm, pnpm, Yarn and Bun installs, so they
      # need the pinned toolchain and download caches.
      - name: Set up pinned tools and download caches
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: integration
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Integration tests (shard ${{ matrix.shard }} of 4)
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration --shard=${{ matrix.shard }}/4
  # Keep this job ID/check name required in branch protection.
  verify:
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
