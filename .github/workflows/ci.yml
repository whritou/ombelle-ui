name: CI
# Fast checks for every push and pull request, aiming for under five minutes.
# The full Foundation gate (40 consumer apps, the browser matrix and
# evidence) runs nightly and on demand in foundation.yml.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: pnpm build:packages
      - name: Fail on stale generated sources
        # build:packages regenerates the schema and catalog copies; committed copies must already match.
        run: git diff --exit-code -- packages/contracts/src packages/catalog/src/generated.ts
      - name: Audit dependencies
        run: pnpm audit:workspace
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm exec vitest run packages apps/www/src
  integration:
    runs-on: ubuntu-latest
    # Shard 4 holds the hosted preview build and the foundation evidence
    # collection, about 15 minutes together; with the 0.9 components the shard
    # runs 17 to 20 minutes, so it has room up to 30.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Integration tests drive real npm, pnpm, Yarn and Bun installs, so they
      # need the pinned toolchain and download caches.
      - name: Set up pinned tools and download caches
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: integration
      - name: Build packages
        run: pnpm build:packages
      - name: Generate preview sources
        run: pnpm generate:preview
      - name: Integration tests (shard ${{ matrix.shard }} of 4)
        run: pnpm exec vitest run --config vitest.integration.config.ts tests/integration --shard=${{ matrix.shard }}/4
  # Keep this job ID/check name required in branch protection.
  verify:
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful checks
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$CHECKS_RESULT" = success && test "$INTEGRATION_RESULT" = success
