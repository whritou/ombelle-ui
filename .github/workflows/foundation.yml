name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: corepack enable
      - name: Prepare Yarn releases outside the project
        working-directory: ${{ runner.temp }}
        run: |
          corepack yarn@1.22.22 --version
          corepack yarn@4.18.1 --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit workspace dependencies
        run: pnpm audit:workspace
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify foundation
        timeout-minutes: 40
        run: pnpm check:foundation
      - name: Stage finalized evidence after process teardown
        if: always()
        timeout-minutes: 3
        run: node scripts/stage-foundation-evidence.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-evidence
          include-hidden-files: true
          path: .artifacts/upload/core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-browser-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .artifacts/upload/browser
