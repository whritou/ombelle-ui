name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pinned tools and download caches
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: quality
      - name: Verify package quality and audit workspace dependencies
        timeout-minutes: 40
        run: pnpm check:foundation:quality
      - name: Stage finalized evidence after process teardown
        if: always()
        timeout-minutes: 3
        run: node scripts/stage-foundation-evidence.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-quality-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/upload/core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-quality-browser-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .artifacts/upload/browser
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pinned tools and download caches
        id: setup
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: consumers
      - name: Cache Playwright browser downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: browsers-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.setup.outputs.node-version }}-playwright-${{ steps.setup.outputs.playwright-version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and system dependencies
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify all consumers and browser checks
        timeout-minutes: 40
        run: pnpm check:foundation:consumers
      - name: Stage finalized evidence after process teardown
        if: always()
        timeout-minutes: 3
        run: node scripts/stage-foundation-evidence.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-consumers-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/upload/core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-consumers-browser-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .artifacts/upload/browser
  # Keep this job ID/check name required in branch protection.
  verify:
    needs: [quality, consumers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require successful prerequisite jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          CONSUMERS_RESULT: ${{ needs.consumers.result }}
        run: test "$QUALITY_RESULT" = success && test "$CONSUMERS_RESULT" = success
      - name: Set up pinned tools and download caches
        uses: ./.github/actions/setup-foundation
        with:
          cache-scope: aggregate
      - name: Download quality core evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-quality-evidence
          path: .artifacts/groups/quality
      - name: Download consumers core evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: foundation-consumers-evidence
          path: .artifacts/groups/consumers
      - name: Rebuild references and validate complete matching evidence
        timeout-minutes: 15
        run: pnpm check:foundation:aggregate .artifacts/groups
      - name: Stage finalized aggregate evidence
        if: always()
        timeout-minutes: 3
        run: node scripts/stage-foundation-evidence.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: .artifacts/upload/core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: foundation-browser-evidence
          include-hidden-files: true
          if-no-files-found: ignore
          path: .artifacts/upload/browser
