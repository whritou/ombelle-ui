name: Foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - run: corepack enable
      - name: Prepare Yarn releases outside the project
        working-directory: ${{ runner.temp }}
        run: |
          corepack yarn@1.22.22 --version
          corepack yarn@4.18.1 --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check:foundation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: foundation-evidence
          include-hidden-files: true
          path: |
            .artifacts/logs
            .artifacts/*results.json
            .artifacts/npm-version.json
            .artifacts/yarn-versions.json
            .artifacts/yarn-matrix.json
            .artifacts/bun-version.json
            .artifacts/bun-matrix.json
            .artifacts/browser-version.json
            .artifacts/foundation-report.json
            .artifacts/install-provenance.json
            .artifacts/audit-*.json
            playwright-report
            test-results
