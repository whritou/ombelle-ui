name: Monitor production
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: monitor-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: scripts/monitor-production.sh
          sparse-checkout-cone-mode: false
      - name: Check site, snapshot API and quotas
        env:
          MONITOR_DATABASE_URL: ${{ secrets.MONITOR_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/monitor-production.sh
